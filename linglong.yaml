version: "1"

package:
  id: org.deepinenespanol.dtk-iptv
  name: "IPTV"
  version: 1.0.0.0
  kind: app
  description: |
    IPTV player for deepin built with Qt 6 and DTK 6

command:
  - /opt/apps/org.deepinenespanol.dtk-iptv/files/bin/dtk-iptv

base: org.deepin.base/25.2.2
runtime: org.deepin.runtime.dtk/25.2.2

# Se empaqueta el .deb ya compilado (el CI lo deja en debs/).
# Se lee de /project/debs/ porque ll-builder vacia linglong/sources.
build: |
  dpkg-deb -X /project/debs/dtk-iptv_*.deb $PREFIX/
  mv $PREFIX/usr/bin $PREFIX/bin
  mv $PREFIX/usr/share $PREFIX/share
  rm -rf $PREFIX/usr
  mv $PREFIX/share/applications/dtk-iptv.desktop $PREFIX/share/applications/org.deepinenespanol.dtk-iptv.desktop
  sed -i 's#^Exec=.*#Exec=/opt/apps/org.deepinenespanol.dtk-iptv/files/bin/dtk-iptv#' \
      $PREFIX/share/applications/org.deepinenespanol.dtk-iptv.desktop

sources: []
